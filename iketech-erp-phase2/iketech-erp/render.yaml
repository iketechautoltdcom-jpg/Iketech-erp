# Render Blueprint for IKETECH AUTO ERP (Phase 1).
# In Render: New → Blueprint → pick this GitHub repository. Render creates the three parts below.
# Plans are starting points for one branch; change them later in the Render dashboard.
databases:
  - name: iketech-db
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: iketech
    user: iketech
    ipAllowList: []            # reachable only from the ERP's own services, never from the internet

services:
  # The engine: business rules, records, money. Private: not reachable from the internet.
  - type: pserv
    runtime: docker
    name: iketech-api
    region: frankfurt
    plan: 0.5c-512mb
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    disk:
      name: files
      mountPath: /data/storage   # vehicle photos and documents
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MIGRATE_ON_START
        value: "true"
      - key: STORAGE_DIR
        value: /data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: iketech-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false              # Render asks for it: the address staff will use, e.g. https://erp.iketechauto.ng

  # The screens staff use in the browser. Public.
  - type: web
    runtime: docker
    name: iketech-web
    region: frankfurt
    plan: 0.5c-512mb
    dockerContext: ./apps/web
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /login
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          name: iketech-api
          type: pserv
          property: hostport
