# Local / single-server deployment. For production, prefer a managed PostgreSQL with point-in-time recovery
# and put a TLS-terminating reverse proxy (Caddy, Nginx, or the cloud load balancer) in front of `web`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: iketech
      POSTGRES_USER: iketech
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U iketech"], interval: 5s, retries: 10 }
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://iketech:${DB_PASSWORD}@db:5432/iketech
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MIGRATE_ON_START: "true"
    volumes: [files:/data/storage]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  dbdata:
  files:
